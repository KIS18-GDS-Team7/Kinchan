# Issue作成時に、既存issue(open/closed)との重複候補をClaudeが判定しコメントする。
#
# 設計判断:
# - 起動方式: issues.opened で自動実行(メンション待ちだと確認漏れが起きるため)
# - 候補なし時: コメントしない(全issueに「重複なし」と書くとノイズになるため)
# - 比較対象: open/closed 両方。件数が少ないうちは全件渡し。
#   数百件を超えたら gh search issues でキーワード絞り込みに切り替える
# - 出力: 候補番号・タイトル・判断理由のみ。推奨アクション(close/統合)は載せない
#   (判断はチーム文脈に依存するため、材料だけ提供しアクションは人が決める)
# - 許可ツール: gh issue view / list / comment のみ(編集・closeは許可しない)
name: Issue duplicate check

on:
  issues:
    types: [opened]

jobs:
  dedup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE_NUMBER: ${{ github.event.issue.number }}

            新規issueが既存issue(open/closed両方)と重複していないか確認してください。

            1. `gh issue view ISSUE_NUMBER` で対象issueのタイトルと本文を読む
            2. `gh issue list --state all --limit 200 --json number,title,body,state` で
               既存issueを取得する(対象issue自身は除外)
            3. 以下のいずれかに該当するものを「重複候補」と判定する
               - 同一の課題を扱っている
               - 一方が他方を包含している
               - 明らかに後継・再提起にあたる
            4. 候補がある場合のみ `gh issue comment ISSUE_NUMBER` で、
               候補ごとに「番号・タイトル・判断理由」を日本語で簡潔にコメントする。
               close や統合などの推奨アクションは書かない
            5. 候補がなければコメントせず終了する
          claude_args: >-
            --allowedTools "Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*)"
