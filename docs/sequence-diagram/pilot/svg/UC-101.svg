<text x="1624.1" y="472.0" font-size="13" text-anchor="start">ド: 8文字以上で英字と数字を含む。氏名: 1〜30文字(備考1、</text>
<text x="1624.1" y="490.0" font-size="13" text-anchor="start">A-17)</text>
