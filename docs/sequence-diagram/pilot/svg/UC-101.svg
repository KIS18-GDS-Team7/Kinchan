<text x="1624.1" y="544.0" font-size="13" text-anchor="start">ユーザーは概念クラス図の「従業員」。削除済みユーザーのユ</text>
<text x="1624.1" y="562.0" font-size="13" text-anchor="start">ーザーIDとも重複できない(備考3)</text>
<path d="M1616.08 646 H1848.02 L1858.02 656 V674 H1616.08 Z" fill="#fde2e2" stroke="#222"/>
