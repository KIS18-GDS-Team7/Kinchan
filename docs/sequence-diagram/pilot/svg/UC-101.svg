<rect x="214.2" y="325.0" width="398.9" height="17.0" fill="#fff"/>
<text x="413.6" y="338.0" font-size="13" text-anchor="middle">4: ユーザー情報(氏名, ユーザーID, パスワード)の入力を求める</text>
<rect x="328.8" y="359.0" width="169.6" height="17.0" fill="#fff"/>
<text x="413.6" y="372.0" font-size="13" text-anchor="middle">5: ユーザー情報を入力する</text>
<rect x="708.0" y="393.0" width="385.9" height="17.0" fill="#fff"/>
<text x="901.0" y="406.0" font-size="13" text-anchor="middle">6: 入力内容の検証を要求する(氏名, ユーザーID, パスワード)</text>
<rect x="1116.8" y="427.0" width="143.6" height="17.0" fill="#fff"/>
<text x="1118.8" y="440.0" font-size="13" text-anchor="start">7: 入力規則を検証する</text>
<rect x="1127.5" y="483.0" width="381.8" height="17.0" fill="#fff"/>
<text x="1318.4" y="496.0" font-size="13" text-anchor="middle">8: 同じユーザーIDのユーザーを探す(削除済みユーザーを含む)</text>
<rect x="1303.4" y="517.0" width="30.0" height="17.0" fill="#fff"/>
<text x="1318.4" y="530.0" font-size="13" text-anchor="middle">有無</text>
<text x="80.0" y="573.0" font-size="13" text-anchor="start" font-weight="bold">opt</text>
<rect x="80.0" y="579.0" width="346.2" height="17.0" fill="#fff"/>
<text x="82.0" y="592.0" font-size="13" text-anchor="start">[ユーザー情報が無効、またはユーザーIDが重複している]</text>
<rect x="730.7" y="605.0" width="340.7" height="17.0" fill="#fff"/>
<text x="901.0" y="618.0" font-size="13" text-anchor="middle">9: 無効である理由、またはユーザーIDの重複を表示する</text>
<rect x="200.5" y="639.0" width="426.2" height="17.0" fill="#fff"/>
<text x="413.6" y="652.0" font-size="13" text-anchor="middle">10: 無効である理由、またはユーザーIDが重複していることを提示する</text>
<rect x="779.9" y="705.0" width="242.2" height="17.0" fill="#fff"/>
<text x="901.0" y="718.0" font-size="13" text-anchor="middle">11: 入力されたユーザー情報を表示する</text>
<rect x="234.1" y="739.0" width="359.2" height="17.0" fill="#fff"/>
<text x="413.6" y="752.0" font-size="13" text-anchor="middle">12: 入力されたユーザー情報を提示し、登録の確認を求める</text>
<text x="80.0" y="795.0" font-size="13" text-anchor="start" font-weight="bold">break</text>
<rect x="80.0" y="801.0" width="188.1" height="17.0" fill="#fff"/>
