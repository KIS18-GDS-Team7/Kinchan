<text x="413.6" y="1048.0" font-size="13" text-anchor="middle">18: 登録ボタンを押す(ユーザーの登録を指示する)</text>
<rect x="704.3" y="1069.0" width="393.5" height="17.0" fill="#fff"/>
<text x="901.0" y="1082.0" font-size="13" text-anchor="middle">19: ユーザーの登録を要求する(氏名, ユーザーID, パスワード)</text>
<rect x="1141.2" y="1103.0" width="354.5" height="17.0" fill="#fff"/>
<text x="1318.4" y="1116.0" font-size="13" text-anchor="middle">20: ユーザーを登録する(氏名, ユーザーID, パスワード)</text>
