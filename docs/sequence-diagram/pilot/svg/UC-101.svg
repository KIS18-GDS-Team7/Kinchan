<text x="323.1" y="182.0" font-size="13" text-anchor="middle">1: ユーザ登録ボタンを押す(ユーザーの登録を要求する)</text>
<rect x="719.2" y="203.0" width="182.6" height="17.0" fill="#fff"/>
<text x="810.5" y="216.0" font-size="13" text-anchor="middle">2: ユーザーの登録を要求する</text>
<rect x="809.7" y="237.0" width="182.6" height="17.0" fill="#fff"/>
<text x="901.0" y="250.0" font-size="13" text-anchor="middle">3: ユーザ登録画面を表示する</text>
<text x="68.0" y="293.0" font-size="13" text-anchor="start" font-weight="bold">loop</text>
<rect x="68.0" y="299.0" width="188.1" height="17.0" fill="#fff"/>
