<text x="1624.1" y="1130.0" font-size="13" text-anchor="start">登録したユーザーは権限を持たず、所属も未設定(事後条件、</text>
<text x="1624.1" y="1148.0" font-size="13" text-anchor="start">備考2)。権限は UC-104、所属は UC-105 で扱う</text>
<path d="M1616.08 1232 H1984.78 L1994.78 1242 V1260 H1616.08 Z" fill="#fde2e2" stroke="#222"/>
<text x="1624.1" y="1252.0" font-size="13" text-anchor="start">Ex-2。入力された内容を保持したまま、メインフロー5に戻る</text>
