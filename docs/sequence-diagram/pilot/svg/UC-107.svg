<text x="1683.1" y="370.0" font-size="13" text-anchor="start">管理先は勤怠管理者権限を持つユーザーにだけある(備考1)</text>
<path d="M1675.0600000000004 468 H1907.7800000000002 L1917.7800000000002 478 V496 H1675.0600000000004 Z" fill="#fde2e2" stroke="#222"/>
<text x="1683.1" y="488.0" font-size="13" text-anchor="start">Alt-1。Alt-2 の1に進む(下の opt)</text>
<path d="M1675.0600000000004 737 H2041.1600000000003 L2051.1600000000003 747 V801 H1675.0600000000004 Z" fill="#fde2e2" stroke="#222"/>
<text x="1683.1" y="757.0" font-size="13" text-anchor="start">Alt-2 の1。Alt-1 からはここに進む。氏名・ユーザーIDで</text>
<text x="1683.1" y="775.0" font-size="13" text-anchor="start">探し、権限・所属で絞る(備考3、A-31)。削除済みユーザー</text>
<text x="1683.1" y="793.0" font-size="13" text-anchor="start">を含めることも指定できる(Alt-3)</text>
<path d="M1675.0600000000004 1046 H1836.5400000000004 L1846.5400000000004 1056 V1074 H1675.0600000000004 Z" fill="#fde2e2" stroke="#222"/>
<text x="1683.1" y="1066.0" font-size="13" text-anchor="start">Alt-4。Alt-2 の1に戻る</text>
<path d="M1675.0600000000004 1163 H2055.4600000000005 L2065.4600000000005 1173 V1227 H1675.0600000000004 Z" fill="#fde2e2" stroke="#222"/>
<text x="1683.1" y="1183.0" font-size="13" text-anchor="start">Alt-2・Alt-3。削除済みユーザーを含めると指定した場合は、</text>
<text x="1683.1" y="1201.0" font-size="13" text-anchor="start">削除済みユーザーを含めた一覧を提示する。メインフロー3に</text>
<text x="1683.1" y="1219.0" font-size="13" text-anchor="start">戻る</text>
<path d="M1675.0600000000004 1315 H2042.4600000000005 L2052.4600000000005 1325 V1343 H1675.0600000000004 Z" fill="#fde2e2" stroke="#222"/>
<text x="1683.1" y="1335.0" font-size="13" text-anchor="start">削除済みを表す属性は概念クラス図にない(ADR-0013、暫定)</text>
<path d="M1675.0600000000004 1485 H2036.2200000000005 L2046.2200000000005 1495 V1531 H1675.0600000000004 Z" fill="#fde2e2" stroke="#222"/>
<text x="1683.1" y="1505.0" font-size="13" text-anchor="start">登録・変更・削除・権限・所属・管理先の操作は各 UC で行</text>
<text x="1683.1" y="1523.0" font-size="13" text-anchor="start">う(備考5)</text>
<path d="M2095.4600000000005 40 H2297.2400000000007 L2307.2400000000007 50 V86 H2095.4600000000005 Z" fill="#fde2e2" stroke="#222"/>
<text x="2103.5" y="60.0" font-size="13" text-anchor="start">UC-107 ユーザー一覧を表示する</text>
<text x="2103.5" y="78.0" font-size="13" text-anchor="start">(メインフロー、Alt-1〜4)</text>
