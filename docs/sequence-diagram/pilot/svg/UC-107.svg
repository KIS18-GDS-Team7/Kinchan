<path d="M1669.6000000000004 350 H2023.2200000000005 L2033.2200000000005 360 V378 H1669.6000000000004 Z" fill="#fde2e2" stroke="#222"/>
<text x="1677.6" y="370.0" font-size="13" text-anchor="start">管理先は勤怠管理者権限を持つユーザーにだけある(備考1)</text>
<path d="M1669.6000000000004 468 H1902.3200000000002 L1912.3200000000002 478 V496 H1669.6000000000004 Z" fill="#fde2e2" stroke="#222"/>
<text x="1677.6" y="488.0" font-size="13" text-anchor="start">Alt-1。Alt-2 の1に進む(下の opt)</text>
<path d="M1669.6000000000004 754 H2035.7000000000003 L2045.7000000000003 764 V818 H1669.6000000000004 Z" fill="#fde2e2" stroke="#222"/>
<text x="1677.6" y="774.0" font-size="13" text-anchor="start">Alt-2 の1。Alt-1 からはここに進む。氏名・ユーザーIDで</text>
<text x="1677.6" y="792.0" font-size="13" text-anchor="start">探し、権限・所属で絞る(備考3、A-31)。削除済みユーザー</text>
<text x="1677.6" y="810.0" font-size="13" text-anchor="start">を含めることも指定できる(Alt-3)</text>
<path d="M1669.6000000000004 1063 H1831.0800000000004 L1841.0800000000004 1073 V1091 H1669.6000000000004 Z" fill="#fde2e2" stroke="#222"/>
<text x="1677.6" y="1083.0" font-size="13" text-anchor="start">Alt-4。Alt-2 の1に戻る</text>
<path d="M1669.6000000000004 1180 H2050.0000000000005 L2060.0000000000005 1190 V1244 H1669.6000000000004 Z" fill="#fde2e2" stroke="#222"/>
<text x="1677.6" y="1200.0" font-size="13" text-anchor="start">Alt-2・Alt-3。削除済みユーザーを含めると指定した場合は、</text>
<text x="1677.6" y="1218.0" font-size="13" text-anchor="start">削除済みユーザーを含めた一覧を提示する。メインフロー3に</text>
<text x="1677.6" y="1236.0" font-size="13" text-anchor="start">戻る</text>
<path d="M1669.6000000000004 1332 H2037.0000000000005 L2047.0000000000005 1342 V1360 H1669.6000000000004 Z" fill="#fde2e2" stroke="#222"/>
<text x="1677.6" y="1352.0" font-size="13" text-anchor="start">削除済みを表す属性は概念クラス図にない(ADR-0013、暫定)</text>
<path d="M1669.6000000000004 1502 H2030.7600000000004 L2040.7600000000004 1512 V1548 H1669.6000000000004 Z" fill="#fde2e2" stroke="#222"/>
<text x="1677.6" y="1522.0" font-size="13" text-anchor="start">登録・変更・削除・権限・所属・管理先の操作は各 UC で行</text>
<text x="1677.6" y="1540.0" font-size="13" text-anchor="start">う(備考5)</text>
<path d="M2090.0000000000005 40 H2291.7800000000007 L2301.7800000000007 50 V86 H2090.0000000000005 Z" fill="#fde2e2" stroke="#222"/>
<text x="2098.0" y="60.0" font-size="13" text-anchor="start">UC-107 ユーザー一覧を表示する</text>
<text x="2098.0" y="78.0" font-size="13" text-anchor="start">(メインフロー、Alt-1〜4)</text>
<text x="16" y="27" font-size="14"><tspan font-weight="bold">sd</tspan> UC-107 ユーザー一覧を表示する</text>
