<rect x="149.0" y="912.0" width="437.2" height="17.0" fill="#fff"/>
<text x="367.6" y="925.0" font-size="13" text-anchor="middle">13: 対象のユーザーの現在の管理先と登録されている所属単位を提示し、</text>
<rect x="229.1" y="929.0" width="277.0" height="17.0" fill="#fff"/>
<text x="367.6" y="942.0" font-size="13" text-anchor="middle">変更後の管理先とする所属単位の指定を求める</text>
<rect x="203.7" y="963.0" width="327.7" height="17.0" fill="#fff"/>
<text x="367.6" y="976.0" font-size="13" text-anchor="middle">14: 変更後の管理先とする所属単位を1つ以上指定する</text>
<rect x="626.2" y="997.0" width="348.2" height="17.0" fill="#fff"/>
<text x="800.3" y="1010.0" font-size="13" text-anchor="middle">15: 指定された管理先の検証を要求する(所属単位の一覧)</text>
<rect x="1007.5" y="1031.0" width="314.7" height="17.0" fill="#fff"/>
<text x="1009.5" y="1044.0" font-size="13" text-anchor="start">16: 所属単位が1つ以上指定されているかを検証する</text>
<text x="80.0" y="1109.0" font-size="13" text-anchor="start" font-weight="bold">opt</text>
<rect x="80.0" y="1115.0" width="221.6" height="17.0" fill="#fff"/>
<text x="82.0" y="1128.0" font-size="13" text-anchor="start">[所属単位が1つも指定されていない]</text>
<rect x="656.0" y="1141.0" width="288.7" height="17.0" fill="#fff"/>
