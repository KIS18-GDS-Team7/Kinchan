<rect x="266.0" y="1588.0" width="203.2" height="17.0" fill="#fff"/>
<text x="367.6" y="1601.0" font-size="13" text-anchor="middle">26: 管理先の割り当てを指示する</text>
<rect x="612.2" y="1622.0" width="376.3" height="17.0" fill="#fff"/>
<text x="800.3" y="1635.0" font-size="13" text-anchor="middle">27: 管理先の割り当てを要求する(ユーザー, 所属単位の一覧)</text>
