<rect x="1007.5" y="512.0" width="338.6" height="17.0" fill="#fff"/>
<text x="1009.5" y="525.0" font-size="13" text-anchor="start">8: 対象のユーザーが勤怠管理者権限を持つかを判定する</text>
<text x="80.0" y="590.0" font-size="13" text-anchor="start" font-weight="bold">opt</text>
<rect x="80.0" y="596.0" width="279.1" height="17.0" fill="#fff"/>
<text x="82.0" y="609.0" font-size="13" text-anchor="start">[対象のユーザーが勤怠管理者権限を持たない]</text>
<rect x="663.5" y="622.0" width="273.6" height="17.0" fill="#fff"/>
<text x="800.3" y="635.0" font-size="13" text-anchor="middle">9: 管理先を割り当てられないことを表示する</text>
<rect x="155.5" y="656.0" width="424.2" height="17.0" fill="#fff"/>
<text x="367.6" y="669.0" font-size="13" text-anchor="middle">10: 対象のユーザーが勤怠管理者権限を持たないため管理先を割り当て</text>
<rect x="294.1" y="673.0" width="147.0" height="17.0" fill="#fff"/>
<text x="367.6" y="686.0" font-size="13" text-anchor="middle">られないことを提示する</text>
<rect x="1023.1" y="739.0" width="424.2" height="17.0" fill="#fff"/>
<text x="1235.1" y="752.0" font-size="13" text-anchor="middle">11: 対象のユーザーの現在の管理先と、登録されている所属単位を取得</text>
<rect x="1220.1" y="756.0" width="30.0" height="17.0" fill="#fff"/>
<text x="1235.1" y="769.0" font-size="13" text-anchor="middle">する</text>
<rect x="1141.1" y="790.0" width="188.1" height="17.0" fill="#fff"/>
<text x="1235.1" y="803.0" font-size="13" text-anchor="middle">管理先の一覧, 所属単位の一覧</text>
<text x="68.0" y="846.0" font-size="13" text-anchor="start" font-weight="bold">loop</text>
<rect x="68.0" y="852.0" width="188.1" height="17.0" fill="#fff"/>
