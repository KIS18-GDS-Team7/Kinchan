<rect x="151.7" y="1175.0" width="431.7" height="17.0" fill="#fff"/>
<text x="367.6" y="1188.0" font-size="13" text-anchor="middle">18: 管理先とする所属単位を1つ以上指定する必要があることを提示する</text>
<rect x="679.2" y="1241.0" width="242.2" height="17.0" fill="#fff"/>
<text x="800.3" y="1254.0" font-size="13" text-anchor="middle">19: 変更前と変更後の管理先を表示する</text>
<rect x="155.5" y="1275.0" width="424.2" height="17.0" fill="#fff"/>
<text x="367.6" y="1288.0" font-size="13" text-anchor="middle">20: 対象のユーザーの変更前と変更後の管理先を提示し、割り当ての確</text>
<rect x="333.1" y="1292.0" width="69.0" height="17.0" fill="#fff"/>
<text x="367.6" y="1305.0" font-size="13" text-anchor="middle">認を求める</text>
<text x="80.0" y="1348.0" font-size="13" text-anchor="start" font-weight="bold">break</text>
<rect x="80.0" y="1354.0" width="214.1" height="17.0" fill="#fff"/>
