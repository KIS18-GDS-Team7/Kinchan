<rect x="709.0" y="359.0" width="182.6" height="17.0" fill="#fff"/>
<text x="800.3" y="372.0" font-size="13" text-anchor="middle">4: ユーザーの一覧を表示する</text>
<rect x="155.5" y="393.0" width="424.2" height="17.0" fill="#fff"/>
<text x="367.6" y="406.0" font-size="13" text-anchor="middle">5: ユーザーの一覧を提示し、対象のユーザー(勤怠管理者権限を持つユ</text>
<rect x="296.8" y="410.0" width="141.5" height="17.0" fill="#fff"/>
<text x="367.6" y="423.0" font-size="13" text-anchor="middle">ーザー)の指定を求める</text>
<rect x="276.3" y="444.0" width="182.6" height="17.0" fill="#fff"/>
<text x="367.6" y="457.0" font-size="13" text-anchor="middle">6: 対象のユーザーを指定する</text>
<rect x="682.0" y="478.0" width="236.7" height="17.0" fill="#fff"/>
