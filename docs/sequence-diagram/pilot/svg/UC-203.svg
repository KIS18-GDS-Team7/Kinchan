<text x="1864.1" y="1193.0" font-size="13" text-anchor="start">削除履歴は削除できない(備考4)。元に戻す操作は無い(備考3、</text>
<text x="1864.1" y="1211.0" font-size="13" text-anchor="start">A-37)。操作者は概念クラス図になく、概念クラス図の削除理</text>
<text x="1864.1" y="1229.0" font-size="13" text-anchor="start">由は UC にない(暫定)</text>
