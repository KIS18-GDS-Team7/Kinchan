<text x="1864.1" y="1265.0" font-size="13" text-anchor="start">物理削除か、削除済みの印を付けて残すかは未定(ADR-0013、</text>
<text x="1864.1" y="1283.0" font-size="13" text-anchor="start">#100 の[12])。まとめて保存する(Ex-2 の事後条件)</text>
