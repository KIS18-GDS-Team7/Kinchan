<text x="1871.6" y="1176.0" font-size="13" text-anchor="start">削除履歴は削除できない(備考4)。元に戻す操作は無い(備考3、</text>
<text x="1871.6" y="1194.0" font-size="13" text-anchor="start">A-37)。操作者は概念クラス図になく、概念クラス図の削除理</text>
<text x="1871.6" y="1212.0" font-size="13" text-anchor="start">由は UC にない(暫定)</text>
