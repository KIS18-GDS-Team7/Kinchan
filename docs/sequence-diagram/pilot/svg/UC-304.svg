<rect x="191.7" y="169.0" width="314.7" height="17.0" fill="#fff"/>
<text x="349.1" y="182.0" font-size="13" text-anchor="middle">1: 出勤ボタンまたは退勤ボタンを押す(打刻の種類)</text>
<rect x="699.7" y="203.0" width="197.7" height="17.0" fill="#fff"/>
<text x="798.6" y="216.0" font-size="13" text-anchor="middle">2: 打刻を要求する(打刻の種類)</text>
<rect x="1090.1" y="237.0" width="182.6" height="17.0" fill="#fff"/>
<text x="1181.4" y="250.0" font-size="13" text-anchor="middle">3: 勤務ステータスを取得する</text>
<rect x="1133.9" y="271.0" width="95.0" height="17.0" fill="#fff"/>
<text x="1181.4" y="284.0" font-size="13" text-anchor="middle">勤務ステータス</text>
<rect x="1029.0" y="305.0" width="299.6" height="17.0" fill="#fff"/>
<text x="1031.0" y="318.0" font-size="13" text-anchor="start">4: 打刻の種類と勤務ステータスの整合を判定する</text>
<text x="68.0" y="383.0" font-size="13" text-anchor="start" font-weight="bold">break</text>
<rect x="68.0" y="389.0" width="84.1" height="17.0" fill="#fff"/>
<text x="70.0" y="402.0" font-size="13" text-anchor="start">[整合しない]</text>
<rect x="700.8" y="415.0" width="195.6" height="17.0" fill="#fff"/>
<text x="798.6" y="428.0" font-size="13" text-anchor="middle">5: 打刻できない理由を表示する</text>
<rect x="212.3" y="449.0" width="273.6" height="17.0" fill="#fff"/>
<text x="349.1" y="462.0" font-size="13" text-anchor="middle">6: 打刻できないことと、その理由を提示する</text>
<text x="1007.0" y="521.0" font-size="13" text-anchor="start" font-weight="bold">opt</text>
<rect x="1007.0" y="527.0" width="149.1" height="17.0" fill="#fff"/>
<text x="1009.0" y="540.0" font-size="13" text-anchor="start">[打刻の種類が「出勤」]</text>
<rect x="1070.6" y="553.0" width="351.6" height="17.0" fill="#fff"/>
<text x="1246.4" y="566.0" font-size="13" text-anchor="middle">7: 当日を勤務日とするアクターの公開済みのシフトを探す</text>
<rect x="1205.4" y="587.0" width="82.0" height="17.0" fill="#fff"/>
<text x="1246.4" y="600.0" font-size="13" text-anchor="middle">シフトの有無</text>
<text x="68.0" y="659.0" font-size="13" text-anchor="start" font-weight="bold">break</text>
<rect x="68.0" y="665.0" width="318.1" height="17.0" fill="#fff"/>
<text x="70.0" y="678.0" font-size="13" text-anchor="start">[打刻の種類が「出勤」で、公開済みのシフトが無い]</text>
<rect x="648.8" y="691.0" width="299.6" height="17.0" fill="#fff"/>
<text x="798.6" y="704.0" font-size="13" text-anchor="middle">8: シフトが無いため打刻できないことを表示する</text>
<rect x="134.3" y="725.0" width="429.6" height="17.0" fill="#fff"/>
<text x="349.1" y="738.0" font-size="13" text-anchor="middle">9: 当日を勤務日とする公開済みのシフトが無いため打刻できないことを</text>
<rect x="321.1" y="742.0" width="56.0" height="17.0" fill="#fff"/>
<text x="349.1" y="755.0" font-size="13" text-anchor="middle">提示する</text>
<rect x="1137.3" y="792.0" width="348.2" height="17.0" fill="#fff"/>
<text x="1311.4" y="805.0" font-size="13" text-anchor="middle">10: 打刻が属する勤怠記録を取得する(無ければ作成する)</text>
<rect x="1283.4" y="826.0" width="56.0" height="17.0" fill="#fff"/>
<text x="1311.4" y="839.0" font-size="13" text-anchor="middle">勤怠記録</text>
<rect x="1259.7" y="860.0" width="233.3" height="17.0" fill="#fff"/>
<text x="1376.4" y="873.0" font-size="13" text-anchor="middle">11: 打刻を記録する(種類, 打刻日時)</text>
<rect x="1036.0" y="894.0" width="290.8" height="17.0" fill="#fff"/>
<text x="1181.4" y="907.0" font-size="13" text-anchor="middle">12: 勤務ステータスを更新する(出勤中/退勤中)</text>
<text x="68.0" y="950.0" font-size="13" text-anchor="start" font-weight="bold">break</text>
<rect x="68.0" y="956.0" width="110.1" height="17.0" fill="#fff"/>
<text x="70.0" y="969.0" font-size="13" text-anchor="start">[保存に失敗した]</text>
<rect x="690.5" y="982.0" width="216.2" height="17.0" fill="#fff"/>
<text x="798.6" y="995.0" font-size="13" text-anchor="middle">13: 保存に失敗したことを表示する</text>
<rect x="241.0" y="1016.0" width="216.2" height="17.0" fill="#fff"/>
<text x="349.1" y="1029.0" font-size="13" text-anchor="middle">14: 保存に失敗したことを提示する</text>
<rect x="587.2" y="1066.0" width="422.9" height="17.0" fill="#fff"/>
<text x="798.6" y="1079.0" font-size="13" text-anchor="middle">15: 打刻の結果を表示する(打刻の種類, 打刻日時, 更新後の勤務ステ</text>
<rect x="773.3" y="1083.0" width="50.5" height="17.0" fill="#fff"/>
<text x="798.6" y="1096.0" font-size="13" text-anchor="middle">ータス)</text>
<rect x="267.0" y="1117.0" width="164.2" height="17.0" fill="#fff"/>
<text x="349.1" y="1130.0" font-size="13" text-anchor="middle">16: 打刻の結果を提示する</text>
<text x="124.0" y="120.0" font-size="13" text-anchor="middle">:従業員</text>
<text x="574.2" y="120.0" font-size="13" text-anchor="middle">:従業員ホーム画面</text>
<text x="1023.0" y="120.0" font-size="13" text-anchor="middle">:打刻制御</text>
<text x="1339.8" y="120.0" font-size="13" text-anchor="middle">:従業員</text>
<text x="1469.8" y="120.0" font-size="13" text-anchor="middle">:シフト</text>
<text x="1599.8" y="120.0" font-size="13" text-anchor="middle">:勤怠記録</text>
<text x="1729.8" y="120.0" font-size="13" text-anchor="middle">:打刻</text>
<path d="M1819.8 278 H2187.2 L2197.2 288 V306 H1819.8 Z" fill="#fde2e2" stroke="#222"/>
<text x="1827.8" y="298.0" font-size="13" text-anchor="start">勤務ステータスは概念クラス図にない(UC-304 備考2、暫定)</text>
<path d="M1819.8 314 H2189.8 L2199.8 324 V360 H1819.8 Z" fill="#fde2e2" stroke="#222"/>
<text x="1827.8" y="334.0" font-size="13" text-anchor="start">「出勤」は「退勤中」のとき、「退勤」は「出勤中」のときに</text>
<text x="1827.8" y="352.0" font-size="13" text-anchor="start">整合する(備考5)</text>
<path d="M1819.8 456 H2045.5 L2055.5 466 V484 H1819.8 Z" fill="#fde2e2" stroke="#222"/>
<text x="1827.8" y="476.0" font-size="13" text-anchor="start">Alt-1。このユースケースを終了する</text>
<path d="M1819.8 594 H2095.42 L2105.42 604 V622 H1819.8 Z" fill="#fde2e2" stroke="#222"/>
<text x="1827.8" y="614.0" font-size="13" text-anchor="start">有無だけを判定し、時刻は照合しない(備考8)</text>
<path d="M1819.8 749 H2188.5 L2198.5 759 V795 H1819.8 Z" fill="#fde2e2" stroke="#222"/>
<text x="1827.8" y="769.0" font-size="13" text-anchor="start">Alt-2。このユースケースを終了する。シフトが無い日も打刻</text>
<text x="1827.8" y="787.0" font-size="13" text-anchor="start">できるようにする変更は #122 で提案中(未マージ)</text>
<path d="M1819.8 833 H2147.42 L2157.42 843 V861 H1819.8 Z" fill="#fde2e2" stroke="#222"/>
<text x="1827.8" y="853.0" font-size="13" text-anchor="start">勤務は出勤打刻を行った日の勤怠記録に属する(備考7)</text>
<path d="M1819.8 901 H2190.58 L2200.58 911 V929 H1819.8 Z" fill="#fde2e2" stroke="#222"/>
<text x="1827.8" y="921.0" font-size="13" text-anchor="start">打刻と勤務ステータスはまとめて保存する(Ex-1 の事後条件)</text>
<path d="M1819.8 1023 H2037.96 L2047.96 1033 V1051 H1819.8 Z" fill="#fde2e2" stroke="#222"/>
<text x="1827.8" y="1043.0" font-size="13" text-anchor="start">Ex-1。このユースケースを中断する</text>
<path d="M1819.8 1124 H2030.4199999999998 L2040.4199999999998 1134 V1152 H1819.8 Z" fill="#fde2e2" stroke="#222"/>
<text x="1827.8" y="1144.0" font-size="13" text-anchor="start">打刻日時は秒まで提示する(備考6)</text>
<path d="M2230.58 40 H2474.22 L2484.22 50 V86 H2230.58 Z" fill="#fde2e2" stroke="#222"/>
<text x="2238.6" y="60.0" font-size="13" text-anchor="start">UC-304 出退勤を打刻する</text>
<text x="2238.6" y="78.0" font-size="13" text-anchor="start">(メインフロー、Alt-1、Alt-2、Ex-1)</text>
<text x="16" y="27" font-size="14"><tspan font-weight="bold">sd</tspan> UC-304 出退勤を打刻する</text>
