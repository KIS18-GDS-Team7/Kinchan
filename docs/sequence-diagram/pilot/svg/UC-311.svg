<rect x="1202.4" y="237.0" width="208.6" height="17.0" fill="#fff"/>
<text x="1306.7" y="250.0" font-size="13" text-anchor="middle">3: アクターの所属単位を取得する</text>
<rect x="1278.7" y="271.0" width="56.0" height="17.0" fill="#fff"/>
