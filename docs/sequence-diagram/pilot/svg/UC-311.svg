<text x="1415.5" y="318.0" font-size="13" text-anchor="middle">4: 所属単位に登録された対象期間と受付期間を取得する</text>
<rect x="1198.6" y="339.0" width="433.8" height="17.0" fill="#fff"/>
<text x="1415.5" y="352.0" font-size="13" text-anchor="middle">対象期間の一覧(対象期間開始日, 対象期間終了日, 受付期間開始日時, </text>
<rect x="1357.8" y="356.0" width="115.5" height="17.0" fill="#fff"/>
<text x="1415.5" y="369.0" font-size="13" text-anchor="middle">受付期間終了日時)</text>
<text x="80.0" y="412.0" font-size="13" text-anchor="start" font-weight="bold">break</text>
<rect x="80.0" y="418.0" width="188.1" height="17.0" fill="#fff"/>
