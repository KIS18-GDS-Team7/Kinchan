<text x="342.6" y="182.0" font-size="13" text-anchor="middle">1: シフト希望ボタンを押す(シフト希望の一覧表示を要求する)</text>
<rect x="770.7" y="203.0" width="195.6" height="17.0" fill="#fff"/>
<text x="868.5" y="216.0" font-size="13" text-anchor="middle">2: シフト希望の一覧を要求する</text>
<rect x="1204.5" y="237.0" width="208.6" height="17.0" fill="#fff"/>
<text x="1308.8" y="250.0" font-size="13" text-anchor="middle">3: アクターの所属単位を取得する</text>
<rect x="1280.8" y="271.0" width="56.0" height="17.0" fill="#fff"/>
<text x="1308.8" y="284.0" font-size="13" text-anchor="middle">所属単位</text>
<rect x="1248.3" y="305.0" width="338.6" height="17.0" fill="#fff"/>
<text x="1417.6" y="318.0" font-size="13" text-anchor="middle">4: 所属単位に登録された対象期間と受付期間を取得する</text>
<rect x="1200.7" y="339.0" width="433.8" height="17.0" fill="#fff"/>
<text x="1417.6" y="352.0" font-size="13" text-anchor="middle">対象期間の一覧(対象期間開始日, 対象期間終了日, 受付期間開始日時, </text>
<rect x="1359.8" y="356.0" width="115.5" height="17.0" fill="#fff"/>
<text x="1417.6" y="369.0" font-size="13" text-anchor="middle">受付期間終了日時)</text>
<text x="80.0" y="412.0" font-size="13" text-anchor="start" font-weight="bold">break</text>
<rect x="80.0" y="418.0" width="188.1" height="17.0" fill="#fff"/>
<text x="82.0" y="431.0" font-size="13" text-anchor="start">[対象期間が登録されていない]</text>
<rect x="831.9" y="444.0" width="260.6" height="17.0" fill="#fff"/>
<text x="962.2" y="457.0" font-size="13" text-anchor="middle">5: 対象期間が登録されていないことを渡す</text>
<rect x="293.1" y="478.0" width="286.6" height="17.0" fill="#fff"/>
<text x="436.4" y="491.0" font-size="13" text-anchor="middle">6: 対象期間が登録されていないことを提示する</text>
<rect x="1193.7" y="528.0" width="221.6" height="17.0" fill="#fff"/>
<text x="1195.7" y="541.0" font-size="13" text-anchor="start">7: 最初に提示する対象期間を決める</text>
<text x="68.0" y="606.0" font-size="13" text-anchor="start" font-weight="bold">loop</text>
<rect x="68.0" y="612.0" width="292.1" height="17.0" fill="#fff"/>
<text x="70.0" y="625.0" font-size="13" text-anchor="start">[提示する対象期間を切り替えるたびに繰り返す]</text>
<rect x="1335.6" y="638.0" width="312.6" height="17.0" fill="#fff"/>
<text x="1491.9" y="651.0" font-size="13" text-anchor="middle">8: 対象期間のアクター自身のシフト希望を取得する</text>
<rect x="1323.2" y="672.0" width="337.3" height="17.0" fill="#fff"/>
<text x="1491.9" y="685.0" font-size="13" text-anchor="middle">一覧(希望日, 希望開始時刻, 希望終了時刻, 処理状態)</text>
<text x="80.0" y="728.0" font-size="13" text-anchor="start" font-weight="bold">alt</text>
<rect x="80.0" y="734.0" width="344.1" height="17.0" fill="#fff"/>
<text x="82.0" y="747.0" font-size="13" text-anchor="start">[その対象期間にアクター自身のシフト希望が存在しない]</text>
<rect x="844.9" y="760.0" width="234.6" height="17.0" fill="#fff"/>
<text x="962.2" y="773.0" font-size="13" text-anchor="middle">9: シフト希望が存在しないことを渡す</text>
<rect x="276.3" y="794.0" width="320.2" height="17.0" fill="#fff"/>
<text x="436.4" y="807.0" font-size="13" text-anchor="middle">10: 該当するシフト希望が存在しないことを提示する</text>
<rect x="80.0" y="828.0" width="149.1" height="17.0" fill="#fff"/>
<text x="82.0" y="841.0" font-size="13" text-anchor="start">[シフト希望が存在する]</text>
<rect x="749.8" y="854.0" width="424.9" height="17.0" fill="#fff"/>
<text x="962.2" y="867.0" font-size="13" text-anchor="middle">11: シフト希望の一覧を渡す(希望日, 希望開始時刻, 希望終了時刻, </text>
<rect x="930.5" y="871.0" width="63.5" height="17.0" fill="#fff"/>
<text x="962.2" y="884.0" font-size="13" text-anchor="middle">処理状態)</text>
<rect x="220.5" y="905.0" width="431.7" height="17.0" fill="#fff"/>
<text x="436.4" y="918.0" font-size="13" text-anchor="middle">12: 対象期間のアクター自身のシフト希望の一覧(希望日、希望開始時刻</text>
<rect x="320.1" y="922.0" width="232.5" height="17.0" fill="#fff"/>
<text x="436.4" y="935.0" font-size="13" text-anchor="middle">・希望終了時刻、処理状態)を提示する</text>
<text x="80.0" y="994.0" font-size="13" text-anchor="start" font-weight="bold">opt</text>
<rect x="80.0" y="1000.0" width="201.1" height="17.0" fill="#fff"/>
<text x="82.0" y="1013.0" font-size="13" text-anchor="start">[提示する対象期間を切り替えた]</text>
<rect x="334.8" y="1026.0" width="203.2" height="17.0" fill="#fff"/>
<text x="436.4" y="1039.0" font-size="13" text-anchor="middle">13: 提示する対象期間を指定する</text>
<rect x="827.1" y="1060.0" width="270.2" height="17.0" fill="#fff"/>
<text x="962.2" y="1073.0" font-size="13" text-anchor="middle">14: シフト希望の一覧を要求する(対象期間)</text>
<rect x="318.0" y="1126.0" width="236.7" height="17.0" fill="#fff"/>
<text x="436.4" y="1139.0" font-size="13" text-anchor="middle">15: 一覧からシフト希望を1件指定する</text>
<rect x="820.6" y="1160.0" width="283.2" height="17.0" fill="#fff"/>
<text x="962.2" y="1173.0" font-size="13" text-anchor="middle">16: シフト希望の詳細を要求する(シフト希望)</text>
<rect x="1409.8" y="1194.0" width="164.2" height="17.0" fill="#fff"/>
<text x="1491.9" y="1207.0" font-size="13" text-anchor="middle">17: シフト希望を取得する</text>
<rect x="1276.7" y="1228.0" width="430.4" height="17.0" fill="#fff"/>
<text x="1491.9" y="1241.0" font-size="13" text-anchor="middle">希望日, 希望開始時刻, 希望終了時刻, 処理状態, 却下理由, 送信日時</text>
<rect x="749.8" y="1262.0" width="424.9" height="17.0" fill="#fff"/>
<text x="962.2" y="1275.0" font-size="13" text-anchor="middle">18: シフト希望の詳細を渡す(希望日, 希望開始時刻, 希望終了時刻, </text>
<rect x="896.9" y="1279.0" width="130.6" height="17.0" fill="#fff"/>
<text x="962.2" y="1292.0" font-size="13" text-anchor="middle">処理状態, 送信日時)</text>
<rect x="214.0" y="1313.0" width="444.7" height="17.0" fill="#fff"/>
<text x="436.4" y="1326.0" font-size="13" text-anchor="middle">19: 指定されたシフト希望の詳細(希望日、希望開始時刻・希望終了時刻、</text>
<rect x="339.6" y="1330.0" width="193.5" height="17.0" fill="#fff"/>
<text x="436.4" y="1343.0" font-size="13" text-anchor="middle">処理状態、送信日時)を提示する</text>
<text x="80.0" y="1386.0" font-size="13" text-anchor="start" font-weight="bold">opt</text>
<rect x="80.0" y="1392.0" width="136.1" height="17.0" fill="#fff"/>
<text x="82.0" y="1405.0" font-size="13" text-anchor="start">[処理状態が「却下」]</text>
