<text x="1975.6" y="402.0" font-size="13" text-anchor="start">「休憩開始」は「出勤中」のとき、「休憩終了」は「休憩中」</text>
<text x="1975.6" y="420.0" font-size="13" text-anchor="start">のときに整合する(備考2、A-67)</text>
<path d="M1967.58 524 H2193.2799999999997 L2203.2799999999997 534 V552 H1967.58 Z" fill="#fde2e2" stroke="#222"/>
<text x="1975.6" y="544.0" font-size="13" text-anchor="start">Alt-1。このユースケースを終了する</text>
<path d="M1967.58 676 H2337.58 L2347.58 686 V722 H1967.58 Z" fill="#fde2e2" stroke="#222"/>
<text x="1975.6" y="696.0" font-size="13" text-anchor="start">日をまたぐ勤務の休憩も、出勤打刻を行った日の勤怠記録に属</text>
<text x="1975.6" y="714.0" font-size="13" text-anchor="start">する(備考7、#82)</text>
<path d="M1967.58 812 H2338.36 L2348.36 822 V840 H1967.58 Z" fill="#fde2e2" stroke="#222"/>
<text x="1975.6" y="832.0" font-size="13" text-anchor="start">打刻と勤務ステータスはまとめて保存する(Ex-1 の事後条件)</text>
