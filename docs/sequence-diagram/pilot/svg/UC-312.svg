<text x="759.6" y="216.0" font-size="13" text-anchor="middle">2: 打刻を要求する(打刻の種類)</text>
<rect x="1051.1" y="237.0" width="182.6" height="17.0" fill="#fff"/>
<text x="1142.4" y="250.0" font-size="13" text-anchor="middle">3: 勤務ステータスを取得する</text>
<rect x="1367.9" y="271.0" width="182.6" height="17.0" fill="#fff"/>
<text x="1459.2" y="284.0" font-size="13" text-anchor="middle">4: 勤務ステータスを取得する</text>
<rect x="1411.7" y="305.0" width="95.0" height="17.0" fill="#fff"/>
<text x="1459.2" y="318.0" font-size="13" text-anchor="middle">勤務ステータス</text>
<rect x="1094.9" y="339.0" width="95.0" height="17.0" fill="#fff"/>
