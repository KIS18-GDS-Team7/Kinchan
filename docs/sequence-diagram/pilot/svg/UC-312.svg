<rect x="990.0" y="373.0" width="299.6" height="17.0" fill="#fff"/>
<text x="992.0" y="386.0" font-size="13" text-anchor="start">5: 打刻の種類と勤務ステータスの整合を判定する</text>
<text x="68.0" y="451.0" font-size="13" text-anchor="start" font-weight="bold">break</text>
<rect x="68.0" y="457.0" width="84.1" height="17.0" fill="#fff"/>
<text x="70.0" y="470.0" font-size="13" text-anchor="start">[整合しない]</text>
<rect x="674.8" y="483.0" width="169.6" height="17.0" fill="#fff"/>
<text x="759.6" y="496.0" font-size="13" text-anchor="middle">6: 打刻できない理由を渡す</text>
<rect x="192.8" y="517.0" width="273.6" height="17.0" fill="#fff"/>
<text x="329.6" y="530.0" font-size="13" text-anchor="middle">7: 打刻できないことと、その理由を提示する</text>
<rect x="1031.6" y="567.0" width="221.6" height="17.0" fill="#fff"/>
<text x="1142.4" y="580.0" font-size="13" text-anchor="middle">8: 打刻が属する勤怠記録を取得する</text>
<rect x="1413.4" y="601.0" width="221.6" height="17.0" fill="#fff"/>
<text x="1524.2" y="614.0" font-size="13" text-anchor="middle">9: 打刻が属する勤怠記録を取得する</text>
<rect x="1496.2" y="635.0" width="56.0" height="17.0" fill="#fff"/>
<text x="1524.2" y="648.0" font-size="13" text-anchor="middle">勤怠記録</text>
<rect x="1114.4" y="669.0" width="56.0" height="17.0" fill="#fff"/>
<text x="1142.4" y="682.0" font-size="13" text-anchor="middle">勤怠記録</text>
<rect x="1025.7" y="703.0" width="233.3" height="17.0" fill="#fff"/>
<text x="1142.4" y="716.0" font-size="13" text-anchor="middle">10: 打刻を記録する(種類, 打刻日時)</text>
<rect x="1472.5" y="737.0" width="233.3" height="17.0" fill="#fff"/>
<text x="1589.2" y="750.0" font-size="13" text-anchor="middle">11: 打刻を記録する(種類, 打刻日時)</text>
<rect x="997.0" y="771.0" width="290.8" height="17.0" fill="#fff"/>
<text x="1142.4" y="784.0" font-size="13" text-anchor="middle">12: 勤務ステータスを更新する(休憩中/出勤中)</text>
<rect x="1313.8" y="805.0" width="290.8" height="17.0" fill="#fff"/>
<text x="1459.2" y="818.0" font-size="13" text-anchor="middle">13: 勤務ステータスを更新する(休憩中/出勤中)</text>
<text x="68.0" y="861.0" font-size="13" text-anchor="start" font-weight="bold">break</text>
<rect x="68.0" y="867.0" width="110.1" height="17.0" fill="#fff"/>
<text x="70.0" y="880.0" font-size="13" text-anchor="start">[保存に失敗した]</text>
<rect x="664.5" y="893.0" width="190.2" height="17.0" fill="#fff"/>
<text x="759.6" y="906.0" font-size="13" text-anchor="middle">14: 保存に失敗したことを渡す</text>
<rect x="221.5" y="927.0" width="216.2" height="17.0" fill="#fff"/>
<text x="329.6" y="940.0" font-size="13" text-anchor="middle">15: 保存に失敗したことを提示する</text>
<rect x="548.2" y="977.0" width="422.9" height="17.0" fill="#fff"/>
<text x="759.6" y="990.0" font-size="13" text-anchor="middle">16: 打刻の結果を渡す(打刻の種類, 打刻日時, 更新後の勤務ステータ</text>
<rect x="747.3" y="994.0" width="24.5" height="17.0" fill="#fff"/>
<text x="759.6" y="1007.0" font-size="13" text-anchor="middle">ス)</text>
<rect x="137.0" y="1028.0" width="385.2" height="17.0" fill="#fff"/>
<text x="329.6" y="1041.0" font-size="13" text-anchor="middle">17: 打刻の種類、打刻日時、更新後の勤務ステータスを提示する</text>
