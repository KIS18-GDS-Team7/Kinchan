<rect x="995.7" y="288.0" width="337.3" height="17.0" fill="#fff"/>
<text x="1164.4" y="301.0" font-size="13" text-anchor="middle">対象日, 修正後の勤怠, 申請理由, 送信日時, 処理状態</text>
<rect x="645.8" y="322.0" width="273.6" height="17.0" fill="#fff"/>
