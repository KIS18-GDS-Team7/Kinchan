<rect x="268.4" y="444.0" width="169.6" height="17.0" fill="#fff"/>
<text x="353.2" y="457.0" font-size="13" text-anchor="middle">6: キャンセルボタンを押す</text>
<rect x="704.3" y="478.0" width="156.6" height="17.0" fill="#fff"/>
<text x="782.6" y="491.0" font-size="13" text-anchor="middle">7: キャンセルを要求する</text>
