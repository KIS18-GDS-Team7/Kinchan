<text x="782.6" y="233.0" font-size="13" text-anchor="middle">2: 取り下げる勤怠修正申請の内容を要求する(勤怠修正申請)</text>
<rect x="1079.6" y="254.0" width="169.6" height="17.0" fill="#fff"/>
