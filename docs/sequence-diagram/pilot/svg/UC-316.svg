<text x="1336.4" y="369.0" font-size="13" text-anchor="middle">4: 変更前のシフトを取得する</text>
<rect x="1247.8" y="390.0" width="177.2" height="17.0" fill="#fff"/>
<text x="1336.4" y="403.0" font-size="13" text-anchor="middle">勤務日, 開始時刻, 終了時刻</text>
<rect x="646.7" y="424.0" width="312.6" height="17.0" fill="#fff"/>
