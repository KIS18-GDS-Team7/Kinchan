<rect x="134.3" y="458.0" width="429.6" height="17.0" fill="#fff"/>
<text x="349.1" y="471.0" font-size="13" text-anchor="middle">6: 取り下げるシフト日時変更申請の内容を提示し、取り下げの確認を求</text>
