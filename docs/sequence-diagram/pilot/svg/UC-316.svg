<text x="803.0" y="974.0" font-size="13" text-anchor="middle">15: 取り下げできないことを表示する</text>
<rect x="137.0" y="995.0" width="424.2" height="17.0" fill="#fff"/>
<text x="349.1" y="1008.0" font-size="13" text-anchor="middle">16: 対象のシフト日時変更申請が取り下げできない状態であることを提</text>
<rect x="327.6" y="1012.0" width="43.0" height="17.0" fill="#fff"/>
<text x="349.1" y="1025.0" font-size="13" text-anchor="middle">示する</text>
