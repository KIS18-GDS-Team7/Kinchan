<text x="1262.8" y="318.0" font-size="13" text-anchor="middle">変更後勤務日, 変更後開始時刻, 変更後終了時刻, 申請理由, 送信日時,</text>
<rect x="1231.0" y="322.0" width="63.5" height="17.0" fill="#fff"/>
