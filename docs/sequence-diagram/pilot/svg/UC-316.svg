<rect x="264.3" y="563.0" width="169.6" height="17.0" fill="#fff"/>
<text x="349.1" y="576.0" font-size="13" text-anchor="middle">7: キャンセルボタンを押す</text>
<rect x="724.7" y="597.0" width="156.6" height="17.0" fill="#fff"/>
<text x="803.0" y="610.0" font-size="13" text-anchor="middle">8: キャンセルを要求する</text>
<rect x="705.2" y="631.0" width="195.6" height="17.0" fill="#fff"/>
<text x="803.0" y="644.0" font-size="13" text-anchor="middle">9: キャンセルの完了を表示する</text>
