<rect x="208.5" y="715.0" width="281.2" height="17.0" fill="#fff"/>
<text x="349.1" y="728.0" font-size="13" text-anchor="middle">11: シフト日時変更申請の取り下げを指示する</text>
<rect x="661.4" y="749.0" width="283.2" height="17.0" fill="#fff"/>
