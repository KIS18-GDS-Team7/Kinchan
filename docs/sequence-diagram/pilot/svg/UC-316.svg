<text x="803.0" y="1163.0" font-size="13" text-anchor="middle">18: 保存に失敗したことを表示する</text>
<rect x="241.0" y="1184.0" width="216.2" height="17.0" fill="#fff"/>
<text x="349.1" y="1197.0" font-size="13" text-anchor="middle">19: 保存に失敗したことを提示する</text>
